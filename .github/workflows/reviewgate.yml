name: ReviewGate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]

jobs:
  review:
    if: >-
      ${{
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.actor != 'dependabot[bot]'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      attestations: read
      contents: read
      pull-requests: write
      issues: write
      checks: write
      statuses: read
    concurrency:
      group: reviewgate-${{ github.workflow }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify standalone install and upgrade
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/reviewgate-standalone-smoke"
          installer="$RUNNER_TEMP/reviewgate-install.sh"
          curl --proto '=https' --tlsv1.2 -LsSf https://raw.githubusercontent.com/LVTD-LLC/reviewgate/main/scripts/install.sh -o "$installer"
          REVIEWGATE_VERSION=v0.9.4 REVIEWGATE_INSTALL_DIR="$install_dir" sh "$installer"
          "$install_dir/reviewgate" --help >/dev/null
          "$install_dir/reviewgate" upgrade
          "$install_dir/reviewgate" --help >/dev/null
          asset_dir="$RUNNER_TEMP/reviewgate-expected-v0.9.5"
          mkdir -p "$asset_dir"
          gh release download v0.9.5 --repo LVTD-LLC/reviewgate --pattern reviewgate-x86_64-unknown-linux-gnu.tar.gz --dir "$asset_dir"
          tar -xzf "$asset_dir/reviewgate-x86_64-unknown-linux-gnu.tar.gz" -C "$asset_dir"
          cmp "$install_dir/reviewgate" "$asset_dir/reviewgate"
          fresh_dir="$RUNNER_TEMP/reviewgate-fresh-smoke"
          REVIEWGATE_VERSION=v0.9.5 REVIEWGATE_INSTALL_DIR="$fresh_dir" sh "$installer"
          cmp "$fresh_dir/reviewgate" "$asset_dir/reviewgate"

      - id: reviewgate
        uses: LVTD-LLC/reviewgate@v0
        with:
          openrouter_api_key: ${{ secrets.OPENROUTER_API_KEY }}
          model: openai/gpt-4.1-mini
          verify_blockers: true
          verifier_model: qwen/qwen3-coder
          min_severity: P4

      - name: Verify bounded deep semantic context
        if: ${{ always() && steps.reviewgate.outcome != 'skipped' }}
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          jq '.metrics.semantic_context' .reviewgate/review.json
          jq -e '
            .metrics.semantic_context.status == "fallback"
            and .metrics.semantic_context.reviewed_sha == env.EXPECTED_HEAD_SHA
            and (
              .metrics.semantic_context.parser == "text+rg"
              or .metrics.semantic_context.parser == "text+builtin_search"
            )
            and all(.metrics.semantic_context.excerpts[]; has("contents") | not)
          ' .reviewgate/review.json

      - name: Verify Action-enabled verifier skips without candidates
        if: ${{ always() && steps.reviewgate.outcome != 'skipped' }}
        shell: bash
        run: |
          set -euo pipefail
          jq '{status, angle_errors, review_stages, metrics, cost_summary, findings, disposition_updates, tracked_findings}' .reviewgate/review.json
          jq -e '
            ([.review_stages[]
              | select(
                  .name == "blocker_verifier"
                  and .status == "skipped"
                  and .model == "qwen/qwen3-coder"
                )] | length) == 1
            and .metrics.verifier_ms == null
            and ([.cost_summary.components[]
              | select(.label == "blocker_verifier")] | length) == 0
          ' .reviewgate/review.json

      - name: Verify exact-head coverage and usage accounting
        if: ${{ always() && steps.reviewgate.outcome != 'skipped' }}
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          jq -e '
            .status == "passed"
            and .score == 5
            and .reviewed_sha == env.EXPECTED_HEAD_SHA
            and .metrics.analyzed_line_count > 0
            and (.angle_errors | length) == 0
            and (.cost_summary.components | length) == 2
            and all(.cost_summary.components[];
              .prompt_tokens > 0 and .completion_tokens > 0
              and .model == "openai/gpt-4.1-mini")
          ' .reviewgate/review.json

  rereview:
    if: >-
      ${{
        github.event_name == 'issue_comment' &&
        github.event.action == 'created' &&
        github.event.issue.pull_request &&
        github.event.issue.state == 'open' &&
        github.event.comment.body == '@reviewgate review' &&
        contains(
          fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
          github.event.comment.author_association
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      issues: write
      pull-requests: write
    concurrency:
      group: reviewgate-rereview-${{ github.event.comment.id }}
      cancel-in-progress: false

    steps:
      - uses: LVTD-LLC/reviewgate@v0
        with:
          mode: rereview
          review_workflow: reviewgate.yml
