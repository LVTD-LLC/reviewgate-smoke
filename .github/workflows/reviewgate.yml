name: ReviewGate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]

jobs:
  review:
    if: >-
      ${{
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.actor != 'dependabot[bot]'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      attestations: read
      contents: read
      pull-requests: write
      issues: write
      checks: write
      statuses: read
    concurrency:
      group: reviewgate-${{ github.workflow }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - id: reviewgate
        uses: LVTD-LLC/reviewgate@v0
        with:
          openrouter_api_key: ${{ secrets.OPENROUTER_API_KEY }}
          min_severity: P4

      - name: Verify deep semantic context
        if: ${{ always() && steps.reviewgate.outcome != 'skipped' }}
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          jq '.metrics.semantic_context' .reviewgate/review.json
          jq -e '
            .metrics.semantic_context.status == "fallback"
            and .metrics.semantic_context.reviewed_sha == env.EXPECTED_HEAD_SHA
            and .metrics.semantic_context.parser == "text+builtin_search"
            and .metrics.semantic_context.changed_symbol_count >= 1
            and .metrics.semantic_context.selected_count >= 1
            and (.metrics.semantic_context.excerpts | length) >= 1
            and all(.metrics.semantic_context.excerpts[]; has("contents") | not)
          ' .reviewgate/review.json

      - name: Verify YAML-enabled blocker verification
        if: ${{ always() && steps.reviewgate.outcome != 'skipped' }}
        shell: bash
        run: |
          set -euo pipefail
          jq '{review_stages, metrics, cost_summary, findings}' .reviewgate/review.json
          jq -e '
            ([.review_stages[]
              | select(
                  .name == "blocker_verifier"
                  and .status == "ran"
                  and .model == "deepseek/deepseek-v4-flash"
                )] | length) == 1
            and (.metrics.verifier_ms | type == "number")
            and ([.cost_summary.components[]
              | select(
                  .label == "blocker_verifier"
                  and .model == "deepseek/deepseek-v4-flash"
                )] | length) == 1
            and ([.findings[]
              | select(
                  .verification.state == "verified"
                  or .verification.state == "rejected"
                )] | length) >= 1
          ' .reviewgate/review.json

  rereview:
    if: >-
      ${{
        github.event_name == 'issue_comment' &&
        github.event.action == 'created' &&
        github.event.issue.pull_request &&
        github.event.issue.state == 'open' &&
        github.event.comment.body == '@reviewgate review' &&
        contains(
          fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
          github.event.comment.author_association
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      issues: write
      pull-requests: write
    concurrency:
      group: reviewgate-rereview-${{ github.event.comment.id }}
      cancel-in-progress: false

    steps:
      - uses: LVTD-LLC/reviewgate@v0
        with:
          mode: rereview
          review_workflow: reviewgate.yml
